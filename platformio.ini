[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
board_build.core = stm32
; Reserve the last two 1 KiB flash pages for power-fail-safe configuration.
board_build.ldscript = ldscript/stm32f103c8_nvm.ld
; UART ISP through the factory USART1 bootloader (PA9/PA10) - no ST-Link.
; Enter ISP with BOOT0=1, BOOT1=0 and a RESET, then:
;   pio run -t upload --upload-port COMx
; Restore BOOT0=0 and press RESET when the upload finishes.
; Wiring and troubleshooting: FLASH_UART.md
upload_protocol = serial
upload_speed = 115200
; Verify the image and preserve the last two NVM pages (see the script).
extra_scripts = tools/upload_uart_flags.py
monitor_speed = 115200
build_flags =
    -flto
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED
